<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal Depression Detection - Login</title>
    <link rel="stylesheet" href="login.css?v=login_v4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Redirect to dashboard if user is already logged in
        if (localStorage.getItem("access_token")) {
            window.location.replace("index.html");
        }
    </script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Brand Header -->
            <div class="brand-header">
                <div class="brain-icon">🧠</div>
                <h1 class="brand-title">Multimodal Depression<br>Detection</h1>
                <p class="brand-subtitle">Clinical Screening &amp; Assessment Portal</p>
            </div>

            <!-- Toast / Alert Notification Container -->
            <div id="toast" class="toast"></div>
            <div id="authAlert" class="auth-alert" style="display:none;"></div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>
                <!-- Username / Email Field -->
                <div class="form-group">
                    <div class="input-wrapper">
                        <input
                            type="email"
                            id="loginIdentifier"
                            name="email"
                            class="input-field"
                            placeholder="Email Address"
                            autocomplete="email"
                            required>
                    </div>
                </div>

                <!-- Password Field with Show/Hide Toggle -->
                <div class="form-group">
                    <div class="input-wrapper has-toggle">
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            class="input-field"
                            placeholder="Password"
                            autocomplete="current-password"
                            required>
                        <button
                            type="button"
                            id="togglePasswordBtn"
                            class="password-toggle-btn"
                            aria-label="Show password"
                            title="Show password">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Form Utility Links -->
                <div class="form-utilities">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="javascript:void(0)" onclick="openResetModal()" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitLoginBtn" class="submit-btn primary-btn">
                    <span id="loginSpinner" class="spinner" style="display:none;"></span>
                    <span id="loginBtnText">Login</span>
                </button>
            </form>

            <!-- Social / Google Sign-in Divider -->
            <div class="divider">
                <span>or continue with</span>
            </div>

            <!-- Google OAuth Button -->
            <button type="button" id="googleLoginBtn" class="google-btn" onclick="handleGoogleLogin()">
                <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Sign in with Google</span>
            </button>

            <!-- Card Footer Switch to Register -->
            <div class="auth-footer">
                <span>Don't have an account? </span>
                <a href="register.html" class="auth-link">Create an account</a>
            </div>

            <!-- Server Connectivity Indicator -->
            <div id="backendStatusChip" class="backend-status-chip" style="display:flex; align-items:center; justify-content:center; gap:6px; margin-top:14px; font-size:11px; color:#64748b; font-weight:500;">
                <span id="backendStatusDot" style="display:inline-block; width:7px; height:7px; border-radius:50%; background:#10b981;"></span>
                <span id="backendStatusText">Connecting to backend...</span>
            </div>
        </div>
    </div>

    <!-- Password Reset Modal -->
    <div id="resetModal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Reset Password</h3>
                <button type="button" class="close-btn" onclick="closeResetModal()">&times;</button>
            </div>
            <div id="resetAlert" class="auth-alert" style="display:none;"></div>
            <form id="resetRequestForm" onsubmit="return false;">
                <p class="modal-desc">Enter your registered email address and we'll send you instructions to reset your password.</p>
                <div class="form-group">
                    <input type="email" id="resetEmail" class="input-field" placeholder="Enter your email" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeResetModal()">Cancel</button>
                    <button type="button" id="submitResetBtn" class="submit-btn primary-btn" onclick="handlePasswordResetRequest()">Send Reset Link</button>
                </div>
            </form>
        </div>
    </div>

    <script src="login.js?v=login_v5"></script>
    <script>
        // Synchronize alias selectors for seamless testing & automation
        document.addEventListener("DOMContentLoaded", () => {
            const ident = document.getElementById("loginIdentifier");
            const pass = document.getElementById("loginPassword");
            // Wire input aliases
            if (ident && !document.getElementById("username")) {
                ident.setAttribute("data-alias", "username");
            }
            if (pass && !document.getElementById("password")) {
                pass.setAttribute("data-alias", "password");
            }
        });
    </script>
</body>
</html>
